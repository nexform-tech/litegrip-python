# Test gate: markdown lint, repository standards, and the hardware-free unit
# suite under tests/.
#
# Tests live in their own workflow: they run on pull requests, while the release
# workflow runs on pushes to the default branch. Mixing the two means a broken
# release blocks a pull request, or the reverse.
#
# The suite is pure stdlib and never touches CAN, so no hardware or extra
# dependency is needed. It imports the SDK straight from src/ (see
# tests/_sdkpath.py), so both src/ and tests/ must be tracked.
#
# The suite runs twice, on the runner's own python3 (3.10) and on 3.14. One
# interpreter is one set of blind spots: 3.14 tightened fcntl.ioctl() and broke
# connect() against every real gripper (#63) while this suite stayed green.
#
# The second interpreter is a step in the same job, not a matrix. `main` requires
# a status check named exactly `test`, and a matrix names its checks
# `test (3.10)` / `test (3.14)`, which would leave that requirement waiting for a
# check that never reports, blocking every merge.
#
# AGENTS.md is deliberately not linted: it is canonical content synced from
# repo-template and must not be edited here.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true # a superseded pull request run is pointless

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.23.3 "README.md" "readme_zn.md"

      - name: Validate repository standards
        run: |
          set -euo pipefail
          test -s README.md
          test -s readme_zn.md
          test -s AGENTS.md
          test -s LICENSE
          python3 -c "import json; json.load(open('.releaserc.json'))"
          python3 -c "import json; json.load(open('.markdownlint.json'))"
          echo "repository standards OK"

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -t tests -v

      # The release workflow only builds after a merge to the default branch, by
      # which point the tag and the GitHub release already exist — a build that
      # fails there burns a version number. Build here instead, on the same
      # interpreter the tests above ran under, so a broken pyproject.toml is
      # stopped at the pull request.
      #
      # The version is deliberately not rewritten: what this checks is that the
      # tree as committed builds. Choosing the number belongs to the tag.
      - name: Build the package
        run: |
          python3 -m pip install --upgrade build
          python3 -m build

      - name: Setup Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Run unit tests on 3.14
        run: |
          python3 -VV
          python3 -m unittest discover -s tests -t tests -v
